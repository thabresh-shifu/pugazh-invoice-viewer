<!DOCTYPE html>
<!--
  Standalone "view invoice" page the salesman app's invoice PDF QR points to
  (see lib/printing/invoice_viewer_config.dart). Deploy this one file as-is
  to any free static host -- GitHub Pages, Cloudflare Pages, Vercel, Netlify
  all work -- then update invoiceViewerBaseUrl in that Dart file to wherever
  it ends up (e.g. https://<you>.github.io/invoice.html).

  Deliberately a single dependency-free HTML file, not a build step or a
  storage upload: it reads the order fresh from Supabase (via the
  get-invoice Edge Function) every time it's opened, so it always shows the
  current invoice with zero ongoing storage/hosting cost.

  Mirrors the PDF's own layout column-for-column (see
  lib/printing/invoice_pdf.dart) -- same line-item columns, same GST-slab
  breakup box, same totals -- so scanning the QR shows the same invoice the
  PDF printed, not a stripped-down summary of it. The get-invoice function
  computes rate/netRate/amount/gstBreakup with the exact same math as
  invoice_pdf.dart / order_totals.dart, so the numbers match exactly.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invoice</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 16px; background: #f4f2f8; color: #221830; }
  .card { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .letterhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .shop h1 { font-size: 16px; margin: 0 0 3px; }
  .shop .line { font-size: 11px; color: #6b6478; }
  .bill { text-align: right; }
  .bill .tax-invoice { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
  .bill .to { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .bill .line { font-size: 11px; color: #6b6478; }
  hr { border: none; border-top: 1px solid #e4e0ec; margin: 12px 0; }
  .meta-row { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; background: #fff; }
  th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { color: #6b6478; font-weight: 700; font-size: 9.5px; text-transform: uppercase; background: #f7f5fa; }
  td.num, th.num { text-align: right; }
  /* The 11-column item table is wider than the card on narrow screens --
     without this, the overflow past the card's right edge shows the
     page's lavender background instead of white. Scrolling (not
     shrinking) keeps every column legible instead of squeezing them. */
  .items { margin-top: 14px; overflow-x: auto; background: #fff; }
  .items table { min-width: 720px; }
  .bottom { display: flex; gap: 14px; margin-top: 16px; flex-wrap: wrap; align-items: flex-start; }
  .gst-box { flex: 1 1 260px; }
  .gst-box table th, .gst-box table td { font-size: 10.5px; }
  .totals-box { flex: 0 0 200px; margin-left: auto; }
  .totals-box .row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .totals-box .grand { font-size: 15px; font-weight: 800; color: #5A3A80; border-top: 1px solid #e4e0ec; margin-top: 4px; padding-top: 6px; }
  .qty-line { font-size: 11.5px; color: #6b6478; margin-top: 8px; }
  .state { text-align: center; padding: 40px 16px; color: #6b6478; }
  .footer { margin-top: 18px; display: flex; justify-content: space-between; font-size: 9.5px; color: #9a94a8; }
  button { margin-top: 18px; background: #5A3A80; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 13px; cursor: pointer; }
  @media print { button { display: none; } body { background: #fff; padding: 0; } .card { box-shadow: none; } }

  /* ---- Paper invoice (same look as the printed bill) ---- */
  body.paper { background: #e9e9e9; padding: 8px 0 24px; overflow-x: hidden; }
  #fit { transform-origin: top left; }
  .sheet { width: 794px; background: #fff; color: #000; padding: 14px 16px 12px; margin: 0 auto; font-family: Helvetica, Arial, sans-serif; font-weight: 700; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  .toprow { display: flex; align-items: center; margin-bottom: 2px; }
  .toprow > div { flex: 1; } .toprow img.tamil { width: 80px; flex: none; position: relative; top: -5px; }
  .toprow .taxinv { text-align: right; font-size: 10px; }
  .frame { border: 1px solid #000; display: flex; flex-direction: column; }
  .lh { display: flex; border-bottom: 1px solid #000; height: 68px; overflow: hidden; }
  .lh .shopc { flex: 1; border-right: 1px solid #000; padding: 5px; display: flex; gap: 6px; }
  .lh .shopc img.logo { width: 54px; height: 54px; object-fit: contain; }
  .lh .shopc img.tamil { width: 95px; display: block; }
  .lh .shopname { font-size: 14px; line-height: 1.15; }
  .lh .t10 { font-size: 9px; line-height: 1.25; }
  .lh .t105 { font-size: 10.5px; line-height: 1.25; }
  .lh .custc { flex: 1; padding: 5px; }
  .lh .custc .nm { font-size: 11px; }
  .lh .custc .ad { font-size: 9.5px; }
  .cashbill { font-size: 18px; align-self: center; }
  .billrow { display: flex; border-bottom: 1px solid #000; padding: 2px 5px; font-size: 10.5px; }
  .billrow div { flex: 1; } .billrow div.mid { flex: 0 0 auto; } .billrow div.area { text-align: right; }
  table.it { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 10px; }
  table.it th { height: 22px; font-size: 9px; line-height: 1.1; border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 0 3px; font-weight: 700; background: #fff; text-transform: none; color: #000; white-space: normal; }
  table.it td { height: 12px; padding: 0 3px; white-space: nowrap; overflow: hidden; border-bottom: none; font-size: 9.5px; }
  table.it th, table.it td { border-left: none; border-right: 1px solid #000; }
  table.it th:last-child, table.it td:last-child { border-right: none; }
  table.it td.fill { height: 100%; padding: 0; }
  table.it tr.spacer td { height: auto; }
  .c { text-align: center; } .r { text-align: right; } .l { text-align: left; }
  .wordsrow { border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 2px 5px; font-size: 9.5px; }
  .wordsrow .wr2 { display: flex; margin-top: 2px; } .wordsrow .wr2 span { flex: 1; }
  .foot { display: flex; align-items: flex-start; padding: 3px 4px 2px; gap: 6px; }
  table.gb { border-collapse: collapse; width: 150px; font-size: 8px; }
  table.gb th, table.gb td { border: 0.7px solid #000; padding: 1.5px 2px; background: #fff; color: #000; font-size: 8px; text-transform: none; white-space: nowrap; }
  .box { border: 0.7px solid #000; height: 68px; padding: 3px; font-size: 7.5px; }
  .box .bt { text-align: center; font-size: 8px; text-decoration: underline; margin-bottom: 2px; }
  .box.upi { width: 76px; font-size: 8px; display: flex; flex-direction: column; justify-content: space-between; }
  .box.upi .qr svg, .box.upi .qr img { width: 40px; height: 40px; display: block; }
  .sp { flex: 1; }
  .totbox { width: 190px; height: 68px; border: 0.7px solid #000; display: flex; flex-direction: column; font-size: 8.5px; }
  .totbox .tt { padding: 1px 5px; border-bottom: 0.7px solid #000; } .totbox .tt.net { font-size: 11px; padding: 1px 5px; }
  .totbox .tr { display: flex; justify-content: space-between; padding: 0.5px 0; }
  .totbox .sig { flex: 1; padding: 1px 5px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; font-size: 8.5px; } .totbox .sig .s2 { font-size: 7px; }
  .pw { display: flex; justify-content: space-between; font-size: 7px; margin-top: 2px; }
  .actions { text-align: center; margin: 14px 0 0; }
  .actions a.pay { display: inline-block; background: #5A3A80; color: #fff; text-decoration: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; margin: 0 6px; }
  @media print { body.paper { background: #fff; padding: 0; } #fit { transform: none !important; } .sheet { box-shadow: none; } .actions { display: none; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="state" id="state">Loading invoice…</div>
  </div>

<script>
  // >>> EDIT THESE PER AGENCY (this static page has no build step; each
  // agency hosts its own copy). SUPABASE_* and SHOP_* must match that
  // agency's app build flags (lib/config/app_brand.dart). <<<
  // Same project the app talks to -- lib/sync/supabase_config.dart. The
  // publishable/anon key is meant to be public; it carries no access beyond
  // what RLS allows, and this page's Edge Function call doesn't rely on RLS
  // at all (see supabase/functions/get-invoice/index.ts).
  const SUPABASE_URL = 'https://iuwrkvbyvlmshskyuxnu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable___jvzX6InpQUFKLFX3FKxA_Acxyo2CO';

  // Matches the constants at the top of lib/printing/invoice_pdf.dart --
  // kept in sync by hand since this page has no build step to share them.
  const SHOP_NAME = 'PUGAZH AGENCY';
  const SHOP_ADDRESS = '';
  const SHOP_MOBILE = '';
  const SHOP_GSTIN = '';
  const POWERED_BY = 'Zline Technologies - 7867976727';

  const money = (v) => Number(v || 0).toFixed(2);
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));


  // ---- Paper-style rendering of a desktop bill's snapshot -----------------
  // The numbers come pre-computed from the app (buildBillSnapshot in
  // lib/printing/bill_pdf.dart); this only lays them out like the printed bill.
  const dmy = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : esc(iso); };
  const qtyText = (v) => (Number(v) === Math.round(Number(v)) ? String(Math.round(Number(v))) : Number(v).toFixed(2));
  const SLABS = [0, 5, 12, 18, 28];

  function loadScript(src) {
    return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
  }

  async function renderSnapshot(sn) {
    document.body.classList.add('paper');
    const gst = sn.isGstBill !== false;
    const lines = sn.lines || [];
    const totalQty = sn.totalQty ?? lines.reduce((s, l) => s + Number(l.qty || 0), 0);
    const totalFree = sn.totalFree ?? lines.reduce((s, l) => s + Number(l.free || 0), 0);

    // Same columns, order and widths as the printed bill (buildBillPdf).
    const cols = [
      ['No', 5, 'c'], ['Item Name', 25, 'l'], ['HSN<br>Code', 14, 'c'], ['MRP', 10, 'r'], ['Qty', 6, 'c'], ['Free', 6, 'c'],
      ['Rate', 10, 'r'], ['S.Disc', 9, 'r'], ['C.Disc', 10, 'r'], ['Taxable<br>Amount', 12, 'r'],
      ...(gst ? [['GST<br>%', 6, 'c']] : []),
      ['Amount', 12, 'r'], ['N.Rate', 10, 'r'],
    ];
    const sum = cols.reduce((s, c) => s + c[1], 0);
    const nz = (v) => (Number(v || 0) === 0 ? '' : money(v));
    const rowCells = (l, i) => [
      i + 1, esc(l.name), esc(l.hsn), money(l.mrp), qtyText(l.qty), Number(l.free) > 0 ? qtyText(l.free) : '',
      money(l.rate), nz(l.discAmt), nz(l.cDiscAmt), money(l.taxable),
      ...(gst ? [Number(l.gstPct).toFixed(0)] : []),
      money(l.amount), money(l.netRate),
    ];
    const MIN_ROWS = 12;
    const rows = lines.map((l, i) => `<tr>${rowCells(l, i).map((v, j) => `<td class="${cols[j][2]}">${v}</td>`).join('')}</tr>`).join('');
    const blanks = Array.from({ length: Math.max(0, MIN_ROWS - lines.length) }, () => `<tr>${cols.map(() => `<td>&nbsp;</td>`).join('')}</tr>`).join('');

    const bySlab = {};
    for (const l of lines) {
      const slab = SLABS.includes(Number(l.gstPct)) ? Number(l.gstPct) : 0;
      const p = bySlab[slab] || { taxable: 0, gst: 0 };
      bySlab[slab] = { taxable: p.taxable + Number(l.taxable), gst: p.gst + (Number(l.taxable) * Number(l.gstPct)) / 100 };
    }
    let used = SLABS.filter((s) => (bySlab[s]?.taxable || 0) > 0);
    if (!used.length) used = [5];
    const tt = Object.values(bySlab).reduce((a, v) => ({ t: a.t + v.taxable, g: a.g + v.gst }), { t: 0, g: 0 });
    const gstBox = gst ? `<table class="gb"><thead><tr><th class="l">GST %</th><th class="r">Taxable</th><th class="r">CGST</th><th class="r">SGST</th></tr></thead><tbody>
      ${used.map((s) => `<tr><td>${s}%</td><td class="r">${money(bySlab[s]?.taxable)}</td><td class="r">${money((bySlab[s]?.gst || 0) / 2)}</td><td class="r">${money((bySlab[s]?.gst || 0) / 2)}</td></tr>`).join('')}
      <tr><th class="l">TOTAL</th><th class="r">${money(tt.t)}</th><th class="r">${money(tt.g / 2)}</th><th class="r">${money(tt.g / 2)}</th></tr></tbody></table>` : '';

    const b = sn.shop.bank || {};
    const bankLines = [b.accountNo && `AC/NO : ${b.accountNo}`, b.bankName && `Bank : ${b.bankName}`, b.ifsc && `IFSC : ${b.ifsc}`, b.branch && `Branch : ${b.branch}`].filter(Boolean);
    const bankBox = gst && bankLines.length ? `<div class="box" style="width:108px"><div class="bt">Bank Details</div>${bankLines.map((l) => `<div>${esc(l)}</div>`).join('')}</div>` : '';
    const upiBox = sn.upiPayload ? `<div class="box upi"><div>Scan &amp; Pay (UPI)</div><div class="qr" id="upiqr"></div></div>` : '';

    const shopCell = gst ? `
        <img class="logo" src="assets/invoice_logo.png" alt="" onerror="this.remove()" />
        <div>
          <div class="shopname">${esc(sn.shop.name)}</div>
          ${(sn.shop.addressLines || []).map((l) => `<div class="t10">${esc(l)}</div>`).join('')}
          <div class="t10">${esc(sn.shop.mobile)}</div>
          <div class="t10">${esc(sn.shop.gstin)}</div>
        </div>` : `<div class="cashbill">CASH BILL</div>`;
    const c = sn.customer || {};
    const custCell = `
        <div class="nm">To. M/s. ${esc(c.name)}</div>
        ${(c.addressLines || []).map((l) => `<div class="ad">${esc(l)}</div>`).join('')}
        ${gst ? `<div class="ad">Cell: ${esc(c.phone)}</div><div class="ad">GST: ${esc(c.gstin)}</div>` : ''}`;

    const sDisc = sn.sDisc ?? lines.reduce((s, l) => s + Number(l.discAmt || 0), 0);
    const cDisc = sn.cDisc ?? lines.reduce((s, l) => s + Number(l.cDiscAmt || 0), 0);

    document.getElementById('card').outerHTML = `
    <div id="fit"><div class="sheet" id="sheet">
      ${gst ? `<div class="toprow"><div></div><img class="tamil" src="assets/invoice_header_tamil.png" alt="" onerror="this.remove()" /><div class="taxinv">TAX INVOICE</div></div>` : ''}
      <div class="frame">
        <div class="lh"><div class="shopc">${shopCell}</div><div class="custc">${custCell}</div></div>
        <div class="billrow"><div>Bill No. : ${esc(sn.billNo)}</div><div class="mid">Date: ${dmy(sn.date)}</div><div class="area">${sn.area ? 'Area : ' + esc(sn.area) : ''}</div></div>
        <table class="it">
          <colgroup>${cols.map((c) => `<col style="width:${(c[1] / sum * 100).toFixed(3)}%">`).join('')}</colgroup>
          <thead><tr>${cols.map((c) => `<th class="${c[2]}">${c[0]}</th>`).join('')}</tr></thead>
          <tbody>${rows}${blanks}</tbody>
        </table>
        <div class="wordsrow"><div>${esc(sn.words)}</div>
          <div class="wr2"><span>Total Qty =&gt; ${qtyText(totalQty)}${Number(totalFree) > 0 ? ' + ' + qtyText(totalFree) + ' free' : ''}</span><span>S.Disc =&gt; ${nz(sDisc)}</span><span>C.Disc =&gt; ${nz(cDisc)}</span></div>
        </div>
        <div class="foot">
          ${gstBox}${bankBox}${upiBox}
          <div class="sp"></div>
          <div class="totbox">
            <div class="tt"><div class="tr"><span>Total Amount :</span><span>${money(sn.totalBeforeRounding)}</span></div>
            <div class="tr"><span>Rounded Off :</span><span>${money(sn.roundOff)}</span></div></div>
            <div class="tt net"><div class="tr"><span>Net Amount :</span><span>${money(sn.netAmount)}</span></div></div>
            <div class="sig"><div>${gst ? esc((sn.shop.name || '').toUpperCase()) : 'CASH BILL'}</div>${gst ? '<div class="s2">Authorised Signatory</div>' : ''}</div>
          </div>
        </div>
      </div>
      <div class="pw"><span>${POWERED_BY}</span></div>
    </div>
    <div class="actions">
      ${sn.upiPayload ? `<a class="pay" href="${esc(sn.upiPayload)}">Pay ₹${money(sn.netAmount)} with UPI</a>` : ''}
      <button onclick="window.print()">Print / Save as PDF</button>
    </div></div>`;

    document.title = `Invoice ${sn.billNo}`;
    fitToScreen();
    window.addEventListener('resize', fitToScreen);

    // Same fixed-amount UPI link the printed bill's QR carries.
    if (sn.upiPayload) {
      try {
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');
        const q = qrcode(0, 'M'); q.addData(sn.upiPayload); q.make();
        document.getElementById('upiqr').innerHTML = q.createSvgTag({ cellSize: 2, margin: 0, scalable: true });
      } catch (e) { const el = document.getElementById('upiqr'); if (el) el.textContent = ''; }
    }
  }

  // The bill is laid out at its true paper width and scaled to fit the screen,
  // so a phone shows the whole invoice exactly as printed (pinch to zoom in).
  function fitToScreen() {
    const fit = document.getElementById('fit'); if (!fit) return;
    // clientWidth, not innerWidth: a page wider than the screen makes
    // innerWidth report the content width on phones.
    const vw = Math.min(document.documentElement.clientWidth, window.visualViewport ? window.visualViewport.width : Infinity);
    const k = Math.min(1, vw / 794);
    fit.style.transform = `scale(${k})`;
    fit.style.width = '794px';
    fit.style.marginLeft = `${Math.max(0, (vw - 794 * k) / 2)}px`;
    fit.style.height = `${fit.firstElementChild.offsetHeight * k + 80}px`;
  }

  async function load() {
    const orderId = new URLSearchParams(location.search).get('order');
    const state = document.getElementById('state');
    if (!orderId) {
      state.textContent = 'No invoice specified.';
      return;
    }
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/get-invoice?order_id=${encodeURIComponent(orderId)}`, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      });
      const data = await res.json();
      if (!res.ok) {
        state.textContent = data.error || 'Could not load this invoice.';
        return;
      }
      if (data.snapshot) { await renderSnapshot(data.snapshot); } else { render(data); }
    } catch (e) {
      state.textContent = 'Could not load this invoice. Check your connection and try again.';
    }
  }

  function render(data) {
    const { order, customer, salesman, lines, gstBreakup } = data;
    const billNo = `ORD-${order.id.slice(0, 6).toUpperCase()}`;

    const itemRows = lines.map((l, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${esc(l.productName)}</td>
        <td>${esc(l.hsnCode)}</td>
        <td class="num">${money(l.mrp)}</td>
        <td class="num">${Number(l.qty) === Math.round(Number(l.qty)) ? Number(l.qty) : Number(l.qty).toFixed(2)} ${esc(l.unit)}</td>
        <td class="num">${money(l.rate)}</td>
        <td class="num">${Number(l.discount_pct ?? 0).toFixed(2)}</td>
        <td class="num">${money(l.taxableAmount)}</td>
        <td class="num">${Number(l.gst_pct ?? 0).toFixed(0)}%</td>
        <td class="num">${money(l.netRate)}</td>
        <td class="num">${money(l.amount)}</td>
      </tr>`).join('');

    const gstRows = gstBreakup.map((g) => `
      <tr>
        <td>${g.slab}%</td>
        <td class="num">${money(g.taxable)}</td>
        <td class="num">${money(g.cgst)}</td>
        <td class="num">${money(g.sgst)}</td>
      </tr>`).join('');
    const gstTotal = gstBreakup.reduce((s, g) => ({ taxable: s.taxable + g.taxable, cgst: s.cgst + g.cgst, sgst: s.sgst + g.sgst }), { taxable: 0, cgst: 0, sgst: 0 });

    const totalQty = order.totalQty;

    document.getElementById('card').innerHTML = `
      <div class="letterhead">
        <div class="shop">
          <h1>${SHOP_NAME}</h1>
          <div class="line">${SHOP_ADDRESS}</div>
          <div class="line">${SHOP_MOBILE}</div>
          <div class="line">${SHOP_GSTIN}</div>
        </div>
        <div class="bill">
          <div class="tax-invoice">TAX INVOICE</div>
          <div class="to">To: M/s. ${esc(customer?.name)}</div>
          ${customer?.place ? `<div class="line">${esc(customer.place)}</div>` : ''}
          <div class="line">Cell: ${esc(customer?.phone)}&nbsp;&nbsp;&nbsp;GST: ${esc(customer?.gst_number)}</div>
        </div>
      </div>
      <hr />
      <div class="meta-row">
        <div>Bill No. : ${billNo}</div>
        <div>Date: ${esc(order.date)}${salesman?.name ? ' · Salesman: ' + esc(salesman.name) : ''}</div>
      </div>
      <div class="items">
        <table>
          <thead><tr>
            <th>No</th><th>Item Name</th><th>HSN Code</th><th class="num">MRP</th><th class="num">Qty</th>
            <th class="num">Rate</th><th class="num">Disc.%</th><th class="num">Taxable Amount</th>
            <th class="num">Gst%</th><th class="num">Net Rate</th><th class="num">Amount</th>
          </tr></thead>
          <tbody>${itemRows}</tbody>
        </table>
      </div>
      <div class="qty-line">Total Qty =&gt; ${Number(totalQty) === Math.round(Number(totalQty)) ? Number(totalQty) : Number(totalQty).toFixed(2)}</div>
      <div class="bottom">
        <div class="gst-box">
          <table>
            <thead><tr><th>GST</th><th class="num">Taxable Amount</th><th class="num">CGST</th><th class="num">SGST</th></tr></thead>
            <tbody>
              ${gstRows}
              <tr style="font-weight:700"><td>TOTAL</td><td class="num">${money(gstTotal.taxable)}</td><td class="num">${money(gstTotal.cgst)}</td><td class="num">${money(gstTotal.sgst)}</td></tr>
            </tbody>
          </table>
        </div>
        <div class="totals-box">
          <div class="row"><span>Total Amount :</span><span>${money(order.totalBeforeRounding)}</span></div>
          <div class="row"><span>Rounded Off :</span><span>${money(order.roundOff)}</span></div>
          <div class="row grand"><span>Net Amount :</span><span>₹${money(order.netAmount)}</span></div>
        </div>
      </div>
      <div class="footer">
        <span>${POWERED_BY}</span>
      </div>
      <button onclick="window.print()">Print / Save as PDF</button>
    `;
  }

  load();
</script>
</body>
</html>
